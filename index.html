<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Varad Quiz Master</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at 20% 20%,#3949ab 0%,transparent 30%),
    radial-gradient(circle at 80% 70%,#7b1fa2 0%,transparent 30%),
    linear-gradient(135deg,#050816,#101b42,#09051c);
    overflow-x:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.4;
    z-index:-1;
    animation:float 7s infinite alternate ease-in-out;
}

body::before{
    background:#00d9ff;
    top:-100px;
    left:-100px;
}

body::after{
    background:#a855f7;
    bottom:-100px;
    right:-100px;
}

@keyframes float{
    from{transform:translateY(0) translateX(0);}
    to{transform:translateY(60px) translateX(40px);}
}

.screen{
    display:none;
    min-height:100vh;
    padding:25px;
}

.screen.active{
    display:block;
}

.container{
    max-width:1100px;
    margin:auto;
}

.logo{
    text-align:center;
    font-size:clamp(42px,7vw,80px);
    font-weight:900;
    margin:25px 0 10px;
    background:linear-gradient(135deg,#ffffff,#50eaff,#a855f7);
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 5px 0 #15215c,0 10px 20px #000;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.card{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.15),
        rgba(255,255,255,.04)
    );
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:28px;
    padding:25px;
    margin:20px 0;
    box-shadow:
    15px 18px 35px rgba(0,0,0,.7),
    -5px -5px 20px rgba(255,255,255,.05);
    transform:perspective(1000px) rotateX(2deg);
}

h1,h2,h3{
    text-align:center;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    font-size:17px;
    margin-top:10px;
}

button{
    border:none;
    color:white;
    font-size:16px;
    font-weight:bold;
    padding:15px;
    border-radius:18px;
    background:linear-gradient(145deg,#334155,#111827);
    cursor:pointer;
    box-shadow:0 8px 0 #020617,0 15px 25px rgba(0,0,0,.5);
    transition:.2s;
}

button:hover:not(:disabled){
    transform:translateY(-4px) rotateX(5deg);
    box-shadow:0 12px 0 #020617,0 20px 30px rgba(0,0,0,.6);
}

button:active:not(:disabled){
    transform:translateY(5px);
    box-shadow:0 3px 0 #020617;
}

button:disabled{
    cursor:not-allowed;
}

.avatar-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:15px;
}

.avatar{
    font-size:50px;
    min-height:120px;
}

.avatar.selected{
    outline:4px solid #00e5ff;
    background:linear-gradient(145deg,#075985,#312e81);
}

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.category{
    min-height:180px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:linear-gradient(
        145deg,
        rgba(65,90,180,.9),
        rgba(20,20,55,.9)
    );
}

.category span{
    font-size:60px;
    margin-bottom:10px;
    filter:drop-shadow(0 10px 10px black);
}

.levels{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
}

.level{
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(
        circle at 30% 25%,
        #ffffff66,
        #4f6cff 25%,
        #10194d 70%
    );
    border:2px solid rgba(255,255,255,.3);
    box-shadow:
    0 10px 0 #050816,
    0 20px 30px rgba(0,0,0,.7);
}

.level b{
    font-size:25px;
}

.locked{
    filter:grayscale(1);
    opacity:.35;
}

.boss{
    border-radius:25px;
    background:radial-gradient(
        circle at 30% 20%,
        #fff59d,
        #ff9800 35%,
        #5c2100 75%
    );
    border:3px solid gold;
}

.quiz-question{
    font-size:clamp(22px,4vw,35px);
    text-align:center;
    margin:30px 0;
}

.question-intro{
    text-align:center;
    color:#67e8f9;
    font-size:18px;
    font-weight:bold;
    margin-top:15px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    color:#111827;
    background:linear-gradient(145deg,#ffffff,#cbd5e1);
    min-height:80px;
    box-shadow:0 8px 0 #64748b,0 15px 25px rgba(0,0,0,.4);
}

.correct{
    background:#4ade80 !important;
}

.wrong{
    background:#fb7185 !important;
}

.topbar{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.stat{
    background:rgba(255,255,255,.12);
    padding:10px 15px;
    border-radius:20px;
}

.progress{
    height:14px;
    background:#0008;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #00e5ff,
        #6366f1,
        #ec4899
    );
    transition:.5s;
}

.hidden{
    display:none;
}

.primary{
    width:100%;
    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #db2777
    );
}

.result{
    text-align:center;
    font-size:25px;
}

.character-display{
    text-align:center;
    font-size:80px;
    margin:10px;
    filter:drop-shadow(0 10px 15px black);
}

@media(max-width:750px){

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .levels{
        grid-template-columns:repeat(2,1fr);
    }

    .answers{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<!-- HOME -->

<div id="home" class="screen active">

<div class="container">

<div class="logo">🏆 QUIZ MASTER</div>

<p class="subtitle">
🎮 3D Quiz Adventure • 40 Levels • Boss Challenges
</p>

<div class="card">

<h2>👤 Create Your Player</h2>

<input
id="playerName"
placeholder="Enter your name"
maxlength="20"
>

<h3 style="margin-top:20px">
Choose Your Character
</h3>

<div class="avatar-grid">

<button class="avatar selected" data-gender="boy" data-avatar="👦">
👦
<br>
BOY
</button>

<button class="avatar" data-gender="girl" data-avatar="👧">
👧
<br>
GIRL
</button>

</div>

</div>

<div class="card">

<h2>🎮 Choose Your Quiz World</h2>

<div class="categories">

<button class="category" onclick="openCategory('general')">
<span>🌍</span>
General Knowledge
</button>

<button class="category" onclick="openCategory('science')">
<span>🔬</span>
Science
</button>

<button class="category" onclick="openCategory('gaming')">
<span>🎮</span>
Gaming
</button>

<button class="category" onclick="openCategory('sports')">
<span>🏆</span>
Sports
</button>

</div>

</div>

</div>
</div>


<!-- LEVEL SCREEN -->

<div id="levelScreen" class="screen">

<div class="container">

<button onclick="goHome()">⬅ HOME</button>

<div class="card">

<div id="levelAvatar" class="character-display">👦</div>

<h1 id="welcomeMessage"></h1>

<h2 id="categoryTitle"></h2>

<p id="levelMessage" style="text-align:center;margin:15px">
Complete a level to unlock the next one!
</p>

<div class="levels" id="levelGrid"></div>

</div>

</div>
</div>


<!-- QUIZ SCREEN -->

<div id="quizScreen" class="screen">

<div class="container">

<button onclick="backLevels()">⬅ LEVELS</button>

<div class="card">

<div id="quizAvatar" class="character-display">
👦
</div>

<div id="questionIntro" class="question-intro"></div>

<div class="topbar">

<div class="stat">
⭐ XP: <span id="xp">0</span>
</div>

<div class="stat">
🔥 Streak: <span id="streak">0</span>
</div>

<div class="stat">
🏆 Score: <span id="score">0</span>
</div>

<div class="stat">
⏱️ <span id="timer">20</span>
</div>

</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<p id="questionNumber" style="text-align:center"></p>

<h2 id="question" class="quiz-question"></h2>

<div id="answers" class="answers"></div>

<button
id="nextButton"
class="primary hidden"
onclick="nextQuestion()">

NEXT QUESTION ➡️

</button>

</div>

</div>
</div>


<!-- RESULT -->

<div id="resultScreen" class="screen">

<div class="container">

<div class="card result">

<div id="resultAvatar" class="character-display">
🏆
</div>

<h1 id="resultTitle">
LEVEL COMPLETE!
</h1>

<p id="resultScore"></p>

<br>

<button class="primary" onclick="backLevels()">
CONTINUE ➡️
</button>

<br><br>

<button onclick="goHome()">
🏠 HOME
</button>

</div>

</div>
</div>


<script>

/* PLAYER */

let playerAvatar = "👦";
let playerGender = "boy";

document.querySelectorAll(".avatar").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".avatar").forEach(x=>{
            x.classList.remove("selected");
        });

        button.classList.add("selected");

        playerAvatar = button.dataset.avatar;
        playerGender = button.dataset.gender;

    });

});


/* QUESTIONS */

const questions = {

general:[

["What is the capital of India?",["Mumbai","New Delhi","Pune","Chennai"],1],
["How many continents are there?",["5","6","7","8"],2],
["Which planet is called the Red Planet?",["Earth","Mars","Jupiter","Venus"],1],
["Which is the largest ocean?",["Indian","Atlantic","Pacific","Arctic"],2],
["Which animal is called the King of the Jungle?",["Tiger","Lion","Elephant","Bear"],1],

["National animal of India?",["Lion","Bengal Tiger","Elephant","Horse"],1],
["Smallest continent?",["Europe","Australia","Asia","Africa"],1],
["How many days are in a leap year?",["365","366","364","367"],1],
["The pyramids are in which country?",["India","Egypt","China","Italy"],1],
["Currency of Japan?",["Yuan","Yen","Dollar","Rupee"],1]

],

science:[

["Which planet is closest to the Sun?",["Mercury","Earth","Mars","Venus"],0],
["What gas do plants use?",["Oxygen","Carbon Dioxide","Nitrogen","Hydrogen"],1],
["How many bones does an adult human have?",["206","100","300","250"],0],
["Water freezes at?",["0°C","50°C","100°C","20°C"],0],
["Which organ pumps blood?",["Brain","Heart","Lungs","Kidney"],1],

["What force pulls objects toward Earth?",["Magnetism","Gravity","Light","Sound"],1],
["Which gas is most common in air?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],1],
["Plants make food using?",["Photosynthesis","Respiration","Digestion","Evaporation"],0],
["Which planet has rings?",["Saturn","Mars","Earth","Mercury"],0],
["The Sun is a?",["Planet","Star","Moon","Comet"],1]

],

gaming:[

["Which device is mainly used to play video games?",["Game console","Printer","Scanner","Calculator"],0],
["What does XP usually mean in games?",["Experience Points","Extra Power","Exit Player","Expert Program"],0],
["What is a boss battle?",["A difficult enemy fight","A race","A menu","A map"],0],
["Which is important in multiplayer games?",["Teamwork","Sleeping","Printing","Drawing"],0],
["What is a level?",["Stage of a game","Computer mouse","Keyboard key","Song"],0],

["What does 'Game Over' mean?",["The game has ended","The game starts","You win money","New phone"],0],
["What is a leaderboard?",["Player ranking list","Game controller","Computer screen","Music player"],0],
["What does multiplayer mean?",["More than one player","One player","No player","Offline only"],0],
["What is a character in a game?",["The player or game person","Internet cable","Battery","Speaker"],0],
["What is a quest?",["A mission or task","A computer virus","A keyboard","A phone call"],0]

],

sports:[

["How many players are on a football team on the field?",["11","5","7","15"],0],
["Which sport uses a bat and ball?",["Cricket","Swimming","Boxing","Running"],0],
["How many rings are in the Olympic symbol?",["5","3","7","10"],0],
["Which sport uses a racket?",["Tennis","Football","Cricket","Kabaddi"],0],
["A marathon is mainly a?",["Running race","Swimming race","Car race","Cycling race"],0],

["Which sport is played at Wimbledon?",["Tennis","Cricket","Football","Hockey"],0],
["How many points is a goal worth in football?",["1","2","3","5"],0],
["Which country is famous for cricket?",["India","Greenland","Antarctica","Iceland"],0],
["Kabaddi is played using?",["Teams","Cars","Horses","Boats"],0],
["Which sport uses a basketball?",["Basketball","Tennis","Cricket","Golf"],0]

]

};


/* CREATE 10 LEVELS */

const gameData = {};

for(let category in questions){

    gameData[category] = [];

    for(let level=0;level<10;level++){

        let levelQuestions = [];

        for(let q=0;q<5;q++){

            let index =
            (level*5+q) % questions[category].length;

            levelQuestions.push(
                questions[category][index]
            );

        }

        gameData[category].push(levelQuestions);

    }

}


/* GAME VARIABLES */

let currentCategory = "";
let currentLevel = 0;
let currentQuestion = 0;

let score = 0;
let streak = 0;

let xp =
Number(localStorage.getItem("quizXP")) || 0;

let answered = false;

let timeLeft = 20;

let timerInterval;


/* SCREENS */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(screen=>{
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    window.scrollTo(0,0);

}


/* PLAYER MESSAGES */

function getPlayerName(){

    let name =
    document.getElementById("playerName").value.trim();

    return name || "Player";

}

function getChampionWord(){

    if(playerGender === "boy"){
        return "Champion";
    }else{
        return "Champion";
    }

}

function getWelcomeMessage(){

    let name = getPlayerName();

    if(playerGender === "boy"){

        return "👦 Welcome, " + name + "! Ready to become a Quiz Champion?";

    }else{

        return "👧 Welcome, " + name + "! Ready to become a Quiz Champion?";

    }

}


/* CATEGORY */

function openCategory(category){

    const name =
    document.getElementById("playerName").value.trim();

    if(!name){

        alert("Please enter your name first!");

        return;

    }

    currentCategory = category;

    document.getElementById("levelAvatar").textContent =
    playerAvatar;

    document.getElementById("welcomeMessage").textContent =
    getWelcomeMessage();

    document.getElementById("categoryTitle").textContent =
    category.toUpperCase() + " WORLD";

    if(playerGender === "boy"){

        document.getElementById("levelMessage").textContent =
        "👦 " + name + ", complete each level and unlock the next challenge!";

    }else{

        document.getElementById("levelMessage").textContent =
        "👧 " + name + ", complete each level and unlock the next challenge!";

    }

    createLevels();

    showScreen("levelScreen");

}


/* LEVELS */

function getUnlocked(){

    return Number(
        localStorage.getItem(
            "unlock_" + currentCategory
        ) || 1
    );

}

function unlockLevel(level){

    const unlocked = getUnlocked();

    if(level > unlocked){

        localStorage.setItem(
            "unlock_" + currentCategory,
            level
        );

    }

}

function createLevels(){

    const grid =
    document.getElementById("levelGrid");

    grid.innerHTML = "";

    const unlocked =
    getUnlocked();

    for(let i=1;i<=10;i++){

        const button =
        document.createElement("button");

        button.classList.add("level");

        if(i===10){

            button.classList.add("boss");

            button.innerHTML =
            "👑<br><b>BOSS</b><br>LEVEL 10";

        }else{

            button.innerHTML =
            "<b>" + i + "</b><br>LEVEL";

        }

        if(i > unlocked){

            button.disabled = true;

            button.classList.add("locked");

            button.innerHTML =
            "🔒<br><b>" + i + "</b>";

        }else{

            button.onclick =
            ()=>startLevel(i-1);

        }

        grid.appendChild(button);

    }

}


/* START LEVEL */

function startLevel(level){

    currentLevel = level;
    currentQuestion = 0;
    score = 0;
    streak = 0;

    document.getElementById("quizAvatar").textContent =
    playerAvatar;

    showScreen("quizScreen");

    loadQuestion();

}


/* PERSONALIZED QUESTION INTRO */

function getQuestionIntro(){

    const name = getPlayerName();

    if(playerGender === "boy"){

        const intros = [

            "👦 " + name + ", show your skills!",
            "🔥 " + name + ", this challenge is waiting for you!",
            "⚡ " + name + ", choose the correct answer!",
            "🏆 " + name + ", can you beat this level?",
            "🎯 " + name + ", focus and answer carefully!"

        ];

        return intros[currentQuestion % intros.length];

    }else{

        const intros = [

            "👧 " + name + ", show your skills!",
            "🔥 " + name + ", this challenge is waiting for you!",
            "⚡ " + name + ", choose the correct answer!",
            "🏆 " + name + ", can you beat this level?",
            "🎯 " + name + ", focus and answer carefully!"

        ];

        return intros[currentQuestion % intros.length];

    }

}


/* LOAD QUESTION */

function loadQuestion(){

    clearInterval(timerInterval);

    answered = false;

    timeLeft =
    currentLevel === 9 ? 10 : 20;

    const questionData =
    gameData[currentCategory]
    [currentLevel]
    [currentQuestion];

    document.getElementById("questionIntro").textContent =
    getQuestionIntro();

    document.getElementById("questionNumber").textContent =
    "LEVEL " +
    (currentLevel+1) +
    " • QUESTION " +
    (currentQuestion+1) +
    " / 5";

    document.getElementById("question").textContent =
    questionData[0];

    document.getElementById("score").textContent =
    score;

    document.getElementById("streak").textContent =
    streak;

    document.getElementById("xp").textContent =
    xp;

    document.getElementById("timer").textContent =
    timeLeft;

    document.getElementById("progressBar").style.width =
    (currentQuestion / 5 * 100) + "%";

    const answersBox =
    document.getElementById("answers");

    answersBox.innerHTML = "";

    questionData[1].forEach((answer,index)=>{

        const button =
        document.createElement("button");

        button.className =
        "answer";

        button.textContent =
        answer;

        button.onclick =
        ()=>checkAnswer(
            index,
            questionData[2],
            button
        );

        answersBox.appendChild(button);

    });

    document.getElementById("nextButton")
    .classList.add("hidden");


    timerInterval =
    setInterval(()=>{

        timeLeft--;

        document.getElementById("timer").textContent =
        timeLeft;

        if(timeLeft <= 0){

            clearInterval(timerInterval);

            if(!answered){

                answered = true;

                document.querySelectorAll(".answer").forEach(btn=>{
                    btn.disabled = true;
                });

                document.getElementById("nextButton")
                .classList.remove("hidden");

            }

        }

    },1000);

}


/* CHECK ANSWER */

function checkAnswer(selected,correct,button){

    if(answered) return;

    answered = true;

    clearInterval(timerInterval);

    const buttons =
    document.querySelectorAll(".answer");

    buttons.forEach((btn,index)=>{

        btn.disabled = true;

        if(index === correct){

            btn.classList.add("correct");

        }

    });


    if(selected === correct){

        score++;

        streak++;

        xp +=
        20 +
        (currentLevel * 5);

        localStorage.setItem(
            "quizXP",
            xp
        );

    }else{

        button.classList.add("wrong");

        streak = 0;

    }


    document.getElementById("score").textContent =
    score;

    document.getElementById("streak").textContent =
    streak;

    document.getElementById("xp").textContent =
    xp;

    document.getElementById("progressBar").style.width =
    ((currentQuestion+1)/5*100) + "%";

    document.getElementById("nextButton")
    .classList.remove("hidden");

}


/* NEXT QUESTION */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < 5){

        loadQuestion();

    }else{

        finishLevel();

    }

}


/* FINISH LEVEL */

function finishLevel(){

    const passed =
    score >= 3;

    const name =
    getPlayerName();

    document.getElementById("resultAvatar").textContent =
    playerAvatar;

    if(passed){

        unlockLevel(currentLevel + 2);

        if(playerGender === "boy"){

            document.getElementById("resultTitle").textContent =
            "🎉 AMAZING, " + name + "! LEVEL COMPLETE!";

        }else{

            document.getElementById("resultTitle").textContent =
            "🎉 AMAZING, " + name + "! LEVEL COMPLETE!";

        }

    }else{

        document.getElementById("resultTitle").textContent =
        "💪 " + name + ", DON'T GIVE UP! TRY AGAIN!";

    }


    document.getElementById("resultScore").innerHTML =

    "🏆 Score: " +
    score +
    " / 5" +

    "<br><br>" +

    "⭐ Total XP: " +
    xp +

    "<br><br>" +

    (passed ?

    "🔓 Great job! The next level is now unlocked!"

    :

    "Get at least 3 correct answers to unlock the next level.");

    showScreen("resultScreen");

}


/* BACK */

function backLevels(){

    clearInterval(timerInterval);

    createLevels();

    showScreen("levelScreen");

}


function goHome(){

    clearInterval(timerInterval);

    showScreen("home");

}

</script>

</body>
</html>
